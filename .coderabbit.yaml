# CodeRabbit configuration — review-seat contest (vault: 05-Validation/review-seat-contest.md)
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
enable_free_tier: true
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches: []
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
